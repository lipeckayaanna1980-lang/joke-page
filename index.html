<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gosuuslugi.ru</title>
    <style>
        /* Стиль для заднего фона страницы */
        body {
            background-color: #0d0d0d; /* Черный цвет */
            color: #00ff00; /* Ярко-зеленый "хакерский" цвет текста */
            font-family: 'Courier New', Courier, monospace; /* Шрифт кода */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        /* Главный блок-рамка по центру экрана */
        .container {
            border: 3px solid #00ff00;
            padding: 40px;
            background-color: #1a1a1a;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.7);
            border-radius: 10px;
        }

        /* Стиль для главного заголовка */
        h1 {
            font-size: 3.5rem;
            color: #ff0000; /* Красный цвет для предупреждения */
            margin-bottom: 20px;
            text-transform: uppercase;
            animation: blink 0.8s infinite; /* Мигание текста */
        }

        /* Стиль для основного текста */
        p {
            font-size: 1.8rem;
            font-weight: bold;
        }

        /* Маленькая приписка внизу */
        .subtext {
            color: #888888;
            font-size: 1rem;
            margin-top: 30px;
        }

        /* Анимация мигания */
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>МЫ ВЗЛОМАЛИ ТВОИ ГОС УСЛУГИ И СЕЙЧАС ВОЗЬМЁМ КУЧУ КРЕДИТОВ!</h1>
        <p>хахахахахахха тебя взломали! Лох ебаный.</p>
        <p class="subtext">(ПОЗДРАВЛЯЕМ ВАС НАЕБАЛИ!)</p>
    </div>

</body>
</html>
